<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Odin calculator</title>
</head>
<body>
    <div class="content">
        <div class="calculator">
            <div id="inputField" class="input">0</div>
            <div class="controls grid">
                <div class="numpad col-4 grid">
                    <div class="col-2 pl-0">
                        <button class="operator bold" data-key="Delete" >C</button>
                    </div>
                    <div class="col-2">
                        <button class="operator" data-key="(">(</button>
                    </div>
                    <div class="col-2">
                        <button class="operator" data-key=")">)</button>
                    </div>
                    <div class="col-2 pl-0">
                        <button class="operand" data-key="7">7</button>
                    </div>
                    <div class="col-2">
                        <button class="operand" data-key="8">8</button>
                    </div>
                    <div class="col-2">
                        <button class="operand" data-key="9">9</button>
                    </div>
                    <div class="col-2 pl-0">
                        <button class="operand" data-key="4">4</button>
                    </div>
                    <div class="col-2">
                        <button class="operand" data-key="5">5</button>
                    </div>
                    <div class="col-2">
                        <button class="operand" data-key="6">6</button>
                    </div>
                    <div class="col-2 pl-0">
                        <button class="operand" data-key="1">1</button>
                    </div>
                    <div class="col-2">
                        <button class="operand" data-key="2">2</button>
                    </div>
                    <div class="col-2">
                        <button class="operand" data-key="3">3</button>
                    </div>
                    <div class="col-4 pl-0">
                        <button class="operand" data-key="0">0</button>
                    </div>
                    <div class="col-2">
                        <button class="operand" data-key=".">.</button>
                    </div>
                </div>
                <div class="operators col-2 grid">
                    <div class="col-3">
                        <button class="operator" data-key="%">%</button>
                    </div>
                    <div class="col-3 pr-0">
                        <button class="operator" data-key="m">mod</button>
                    </div>
                    <div class="col-3">
                        <!-- Could not figure out how to handle "Dead" key ^, use "e" instead -->
                        <button class="operator" data-key="e">^</button>
                    </div>
                    <div class="col-3 pr-0">
                        <button class="operator" data-key="r">&#8730;</button>
                    </div>
                    <div class="col-3">
                        <button class="operator" data-key="*">&times;</button>
                    </div>
                    <div class="col-3 pr-0">
                        <button class="operator" data-key="/">&div;</button>
                    </div>
                    <div class="col-3">
                        <button class="operator" data-key="+">&plus;</button>
                    </div>
                    <div class="col-3 pr-0">
                        <button class="operator" data-key="-">&minus;</button>
                    </div>
                    <div class="col pr-0">
                        <button class="operator" data-key="Enter">=</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer>
        2024 - 
        <a href="https://github.com/arnaudSanchez1816/odin-calculator"><i class="fa fa-github" style="font-size:36px"></i></a>
    </footer>
    <script type="module" src="js/script.js"></script>
</body>
</html>
