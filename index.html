<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Odin calculator</title>
</head>
<body>
    <div class="calculator">
        <div class="input">
            <span>000000000000000000000000000</span>
        </div>
        <div class="controls">
            <div class="numpad">
                <button class="control-button">7</button>
                <button class="control-button">8</button>
                <button class="control-button">9</button>
                <button class="control-button">4</button>
                <button class="control-button">5</button>
                <button class="control-button">6</button>
                <button class="control-button">1</button>
                <button class="control-button">2</button>
                <button class="control-button">3</button>
                <button class="control-button large">0</button>
                <button class="control-button">.</button>
            </div>
            <div class="operators">
                <button class="operator" type="button">+</button>
                <button class="operator" type="button">/</button>
                <button class="operator" type="button">-</button>
                <button class="operator" type="button">*</button>
                <button class="operator" type="button"><span class="italic">x</span>²</button>
                <button class="operator" type="button">√</button>
                <button class="operator large" type="button">=</button>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
